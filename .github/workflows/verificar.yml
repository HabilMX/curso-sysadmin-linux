name: Verificar el curso

# En cada cambio se revisa lo que el alumno lee: que ninguna liga relativa apunte a
# un archivo que no existe y, en cuanto haya lecciones, que estén las mismas en los
# cinco idiomas. Esta corrida es pública: cualquiera puede abrirla y ver el resultado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ninguna liga relativa rota, y las mismas lecciones en los cinco idiomas
        run: |
          python3 - <<'PY'
          import os, re, sys
          idiomas = ["es", "en", "fr", "pt", "bg"]
          lecciones = {l: sorted(f for f in os.listdir(l) if re.match(r"\d\d-.*\.md$", f))
                       for l in idiomas if os.path.isdir(l)}
          fallas = 0
          if lecciones:
              base = lecciones.get("es", [])
              for l in idiomas:
                  if lecciones.get(l) != base:
                      print(f"❌ {l}/ no tiene las mismas lecciones que es/"); fallas += 1
          else:
              print("ℹ️  Todavía no hay lecciones: solo se revisan las ligas del README.")
          archivos = ["README.md"] + [f"{l}/{f}" for l, fs in lecciones.items() for f in fs]
          archivos += [f"{l}/README.md" for l in lecciones if os.path.exists(f"{l}/README.md")]
          revisadas = 0
          for a in archivos:
              for destino in re.findall(r"\]\(([^)\s]+)\)", open(a, encoding="utf-8").read()):
                  if re.match(r"(https?:|mailto:|#)", destino):
                      continue
                  ruta = os.path.normpath(os.path.join(os.path.dirname(a), destino.split("#")[0]))
                  revisadas += 1
                  if not os.path.exists(ruta):
                      print(f"❌ {a}: la liga «{destino}» apunta a {ruta}, que no existe"); fallas += 1
          print(f"Archivos revisados: {len(archivos)} · ligas relativas: {revisadas}")
          if revisadas == 0:
              print("❌ No se revisó ninguna liga relativa: el paso no midió nada."); sys.exit(1)
          sys.exit(1 if fallas else 0)
          PY

      - name: Nota sobre la revisión previa a publicar
        run: |
          echo "La revisión de material no publicable (rutas internas, nombres reservados,"
          echo "direcciones de la infraestructura) se corre ANTES de publicar, con la lista"
          echo "de patrones que vive en el repositorio de trabajo y no se publica."
